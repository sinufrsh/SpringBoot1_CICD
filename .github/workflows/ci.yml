name: Java CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
  deploy:
    needs: build
    runs-on: ubuntu-latest


    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
      - name: Check download file
        run: ls -l
      - name: Test SSH connection
        run: |
           mkdir -p ~/.ssh
           echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
           chmod 600 ~/.ssh/ec2_key
           ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "whoami && hostname"
      - name: Copy JAR to EC2
        run: |
           scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            SpringBoot1-1.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/

      - name: Verify JAR on EC2
        run: |
           ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "ls -lh /home/ubuntu/SpringBoot1-1.0.jar"
      - name: Start Spring Boot application
        run: |
            ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "java -jar /home/ubuntu/SpringBoot1-1.0.jar > /home/ubuntu/app.log 2>&1 &"